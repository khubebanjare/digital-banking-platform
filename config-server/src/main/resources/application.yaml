server:
  port: 8888

spring:
  application:
    name: config-server

  profiles:
    active: git

  cloud:
    config:
      server:
        git:
          uri: https://github.com/khubebanjare/digital-payment-config-repo.git
          default-label: main
          clone-on-start: true
          timeout: 5
          force-pull: true
    bus:
      enabled: true

eureka:
  client:
    enabled: false
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: "*"

info:
  app:
    name: "${spring.application.name}"
    description: "Configuration Server for centralized configuration management"
    version: "1.0.0"